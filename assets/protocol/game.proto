syntax = "proto3";

package riot;

// Cosmetic character choices. Keep existing enum values stable.
enum CharacterType {
  Blue = 0;
  Brown = 1;
  Green = 2;
  Black = 3;
  Gray = 4;
  Olive = 5;
  Cyan = 6;
  Survivor = 7;
  Zombie = 8;
  Villain = 9; // Reserved for server-controlled bots.
}

enum WeaponType {
  Pistol = 0;
  DesertEagle = 1;
  Ak47 = 2;
  RocketLauncher = 3;
  reserved 4;
  reserved "Flamethrower";
}

message Position {
  float x = 1;
  float y = 2;
}

// Client requests.
message JoinGame {
  string client_request_id = 1;
  uint64 timestamp_millis = 2;
  string username = 3;
  CharacterType character_type = 4;
  optional string game_id = 5;
  // Creation settings only; joining keeps the existing room settings.
  optional uint32 bot_count = 6;
  optional uint32 bot_difficulty = 7;
}

message ExitGame {
  string client_request_id = 1;
  uint64 timestamp_millis = 2;
  string username = 3;
  string game_id = 4;
  uint64 player_id = 5;
}

message PlayerInput {
  string client_request_id = 1;
  uint64 timestamp_millis = 2;
  uint64 player_id = 3;
  string game_id = 4;
  bool up = 5;
  bool down = 6;
  bool left = 7;
  bool right = 8;
  bool shooting = 9;
  float aim_angle = 10;
  bool sprinting = 11;
}

message ClientEnvelope {
  oneof payload {
    JoinGame join_game = 1;
    ExitGame exit_game = 2;
    PlayerInput player_input = 3;
  }
}

// Join confirmation and snapshot objects.
message Welcome {
  string server_request_id = 1;
  uint64 timestamp_millis = 2;
  uint64 player_id = 3;
  string game_id = 4;
}

message Player {
  uint64 player_id = 1;
  CharacterType character_type = 2;
  string username = 3;
  float health = 4;
  float speed = 5;
  float aim_angle = 6;
  WeaponType weapon_type = 7;
  bool riding_train = 8;
  uint32 respawn_count = 9;
  uint32 kills = 10;
  uint32 deaths = 11;
  uint32 ammo = 12;
  uint32 ammo_capacity = 13;
}

message Bullet {
  uint64 owner = 1;
  WeaponType weapon_type = 2;
  float aim_angle = 3;
}

message Weapon {
  WeaponType weapon_type = 1;
  uint64 expires_at_millis = 2;
  uint64 lifetime_millis = 3;
}

message Train {
  float aim_angle = 1;
  float width = 2;
  float height = 3;
  float speed = 4;
  uint32 carriage_index = 5;
  uint32 corner_count = 6;
}

// Deleted fields stay reserved so older wire IDs never acquire a new meaning.
message ObjectState {
  reserved 6;
  reserved "boundary";
  uint64 entity_id = 1;
  Position position = 2;
  oneof object {
    Player player = 3;
    Bullet bullet = 4;
    Weapon weapon = 5;
    Train train = 7;
  }
}

message InputAck {
  uint64 player_id = 1;
  string last_processed_client_request_id = 2;
}

// The server controls the round phase and its countdown deadline.
message RoundState {
  uint32 number = 1;
  bool intermission = 2;
  uint64 ends_at_millis = 3;
}

// Identical for every recipient; encoded once per game update.
message StateSnapshot {
  string game_id = 1;
  uint64 timestamp_millis = 2;
  repeated ObjectState objects = 3;
  repeated InputAck acknowledgements = 4;
  RoundState round = 5;
}

// Discrete gameplay events, sent separately from snapshots.
message GunFired {
  string server_request_id = 1;
  uint64 timestamp_millis = 2;
  uint64 player_id = 3;
  string game_id = 4;
  WeaponType weapon_type = 5;
  Position position = 6;
  float aim_angle = 7;
}

message PlayerKilled {
  string game_id = 1;
  uint64 killer_id = 2;
  uint64 victim_id = 3;
  string killer_name = 4;
  string victim_name = 5;
  WeaponType weapon_type = 6;
  Position position = 7;
}

message PlayerDamaged {
  string game_id = 1;
  uint64 player_id = 2;
  float damage = 3;
  float health = 4;
}

message TrainWhistle {
  string game_id = 1;
  Position position = 2;
}

message Error {
  string code = 1;
}

message ServerEnvelope {
  reserved 6, 7, 8;
  reserved "player_died", "player_left", "pong";
  oneof payload {
    Welcome welcome = 1;
    StateSnapshot state_snapshot = 2;
    GunFired gun_fired = 3;
    PlayerKilled player_killed = 4;
    Error error = 5;
    TrainWhistle train_whistle = 9;
    PlayerDamaged player_damaged = 10;
  }
}
