[package]
name = "server"
default-run = "server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
hecs = "0.11.2"
fastrand = "2.5.0"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }

bytes = "1"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
